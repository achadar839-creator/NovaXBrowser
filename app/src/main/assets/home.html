<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Infer Browser</title>
<style>
:root { --cyan: #43eaff; --text: #eaf8ff; --green: #38f5a3; }
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { min-height: 100vh; background: transparent !important; color: var(--text); font-family: Arial, sans-serif; overflow-x: hidden; padding-bottom: 20px; }
.topbar { height: 68px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; }
.brand-icon { width: 39px; height: 39px; border-radius: 13px; display: grid; place-items: center; font-size: 22px; font-weight: bold; color: white; background: rgba(8, 127, 196, 0.8); border: 1px solid #43dfff; }
.brand-name { font-size: 18px; font-weight: 800; } .brand-name span { color: var(--cyan); }
.hero { text-align: center; padding: 30px 20px 10px; }
.clock { font-size: 45px; font-weight: 300; text-shadow: 0 0 20px rgba(0,0,0,0.8); }

/* Search Area & Suggestions */
.search-container { position: relative; margin: 25px 19px 0; z-index: 50; }
.search-wrap { padding: 2px; border-radius: 19px; background: linear-gradient(110deg, var(--cyan), #25efb0); }
.search-box { height: 55px; border-radius: 17px; background: rgba(7, 22, 38, 0.95); display: flex; align-items: center; padding: 0 15px; gap: 12px; }
.search-box input { flex: 1; background: transparent; border: none; outline: none; color: white; font-size: 15px; }
.suggestions { position: absolute; top: 62px; left: 0; right: 0; background: rgba(5, 15, 25, 0.95); border-radius: 15px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); display: none; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
.sugg-item { padding: 12px 15px; color: white; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; display: flex; align-items: center; gap: 10px; }
.sugg-item:last-child { border-bottom: none; }
.sugg-icon { color: #8199ad; font-size: 16px; }

.section-title { font-size: 12px; font-weight: 700; letter-spacing: 1px; margin: 30px 20px 15px; color: #829bad; }
.shortcuts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 10px; margin: 0 20px; }
.shortcut { text-align: center; text-decoration: none; color: white; }
.shortcut-icon { width: 50px; height: 50px; margin: auto; display: grid; place-items: center; border-radius: 16px; background: rgba(20, 46, 72, 0.7); border: 1px solid rgba(255,255,255,0.2); font-size: 22px; backdrop-filter: blur(10px); }
.shortcut-name { display: block; margin-top: 8px; font-size: 11px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
.status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin: 30px 19px 0; }
.status-card { border-radius: 16px; padding: 15px 12px; background: rgba(10, 31, 49, 0.7); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
.status-icon { font-size: 19px; margin-bottom: 9px; } .status-name { font-size: 11px; font-weight: bold; } .status-value { margin-top: 6px; font-size: 10px; color: var(--green); }
</style>
</head>
<body>
<header class="topbar"><div style="display:flex; align-items:center; gap:10px;"><div class="brand-icon">i</div><div class="brand-name">INFER <span>WEB</span></div></div></header>
<main>
<section class="hero"><div class="clock" id="clock">00:00</div></section>

<!-- Search Area -->
<div class="search-container" id="searchContainer">
    <form class="search-wrap" id="searchForm">
        <div class="search-box">
            <span style="color:var(--cyan); font-size:20px;">⌕</span>
            <input type="search" id="searchInput" placeholder="Search Google..." autocomplete="off">
        </div>
    </form>
    <div id="suggestions" class="suggestions"></div>
</div>

<div class="section-title">QUICK ACCESS</div>
<div class="shortcuts">
<a class="shortcut" href="https://www.google.com"><div class="shortcut-icon">G</div><span class="shortcut-name">Google</span></a>
<a class="shortcut" href="https://www.youtube.com"><div class="shortcut-icon">▶</div><span class="shortcut-name">YouTube</span></a>
<a class="shortcut" href="https://www.instagram.com"><div class="shortcut-icon">◎</div><span class="shortcut-name">Instagram</span></a>
<a class="shortcut" href="https://www.facebook.com"><div class="shortcut-icon">f</div><span class="shortcut-name">Facebook</span></a>
</div>

<section class="status-grid">
<div class="status-card"><div class="status-icon">🛡️</div><div class="status-name">PRIVACY SHIELD</div><div class="status-value">● PROTECTED</div></div>
<div class="status-card"><div class="status-icon">⚡</div><div class="status-name">AD BLOCKER</div><div class="status-value">● ACTIVE</div></div>
</section>
</main>
<script>
// Dynamic Theme (वॉलपेपर का रंग)
function setDynamicTheme(c) { document.documentElement.style.setProperty('--cyan', c); }

// Clock
function updateClock() { document.getElementById("clock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
setInterval(updateClock, 1000); updateClock();

// Google Search Suggestions Logic
function showSuggestions(data) {
    const list = data[1];
    const box = document.getElementById("suggestions");
    if(!list || list.length === 0) { box.style.display = "none"; return; }
    box.innerHTML = "";
    list.slice(0, 5).forEach(item => {
        const div = document.createElement("div");
        div.className = "sugg-item";
        div.innerHTML = `<span class="sugg-icon">⌕</span><span>${item}</span>`;
        div.onclick = function() { window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(item); };
        box.appendChild(div);
    });
    box.style.display = "block";
}

document.getElementById("searchInput").addEventListener("input", function() {
    const q = this.value.trim();
    if(!q) { document.getElementById("suggestions").style.display = "none"; return; }
    const oldScript = document.getElementById("jsonpScript");
    if(oldScript) oldScript.remove();
    const script = document.createElement("script");
    script.id = "jsonpScript";
    // Google Autocomplete API 
    script.src = "https://suggestqueries.google.com/complete/search?client=chrome&q=" + encodeURIComponent(q) + "&callback=showSuggestions";
    document.body.appendChild(script);
});

// बाहर क्लिक करने पर Suggestions बंद हो जाएं
document.addEventListener("click", function(e) {
    if(!e.target.closest("#searchContainer")) {
        document.getElementById("suggestions").style.display = "none";
    }
});

// "Go/Enter" दबाने पर Google Search
document.getElementById("searchForm").addEventListener("submit", function(e) { 
    e.preventDefault(); 
    const q = document.getElementById("searchInput").value.trim(); 
    if(q) window.location.href = q.includes(".") && !q.includes(" ") ? "https://" + q : "https://www.google.com/search?q=" + encodeURIComponent(q); 
});
</script>
</body>
</html>
